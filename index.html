<!DOCTYPE html>
<html lang="en">

<head>
    <title>Baked & Ready Ltd</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Jessy-Scott">
    <link rel="stylesheet" href="log.css">
    <link rel="icon" href="Brown and Beige Vintage Circle Bakery Logo.png" type="image/png">
</head>

<body>
    <nav class="navbar">
        <div class="navdiv">
            <div class="logo">
                <a href="#">Baked & Ready Ltd</a>
            </div>
        </div>
    </nav>

    <div class="background">
        <div class="login-box">
            <form id="signupForm">
                <h2>Sign Up</h2>

                <div class="input-box">
                    <input type="email" id="email" required placeholder=" ">
                    <label>Email</label>
                    <small class="error"></small>
                </div>

                <div class="input-box">
                    <input type="password" id="password" required placeholder=" ">
                    <label>Password</label>
                    <small class="error"></small>
                </div>

                <div class="input-box">
                    <input type="text" id="username" required placeholder=" ">
                    <label>Username</label>
                    <small class="error"></small>
                </div>

                <button type="submit">Sign Up</button>
            </form>
        </div>
    </div>

    <script>
        const form = document.getElementById('signupForm');

        form.addEventListener('submit', function (e) {
            e.preventDefault();

      
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const usernameInput = document.getElementById('username');

            let valid = true;

           
            document.querySelectorAll('.error').forEach(el => el.textContent = '');

            
            const emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;
            if (!emailInput.value.match(emailPattern)) {
                emailInput.nextElementSibling.textContent = 'Please enter a valid email (example@email.com)';
                valid = false;
            }

            
            if (passwordInput.value.length < 6) {
                passwordInput.nextElementSibling.textContent = 'Password must be at least 6 characters';
                valid = false;
            }

            
            if (usernameInput.value.length < 3) {
                usernameInput.nextElementSibling.textContent = 'Username must be at least 3 characters';
                valid = false;
            }

            
            if (valid) {
                localStorage.setItem('userEmail', emailInput.value);
                localStorage.setItem('userPassword', passwordInput.value);
                localStorage.setItem('username', usernameInput.value);

                window.location.href = 'BakedReady.html.html';
            }
        });
    </script>
</body>
</html>
